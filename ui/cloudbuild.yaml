steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '--build-arg'
      - 'NEXT_PUBLIC_BASE_PATH=/horizon'
      - '--build-arg'
      - 'NEXT_PUBLIC_IMAGE_BASE=https://storage.googleapis.com/horizon-hotels-images'
      - '-t'
      - '$_IMAGE'
      - '.'
images:
  - '$_IMAGE'
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
